<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Cake Enquiry | Haya's Artisan Bakery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Haya's Artisan Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Custom Cakes</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Let's Design Your Cake</h2>
        <p>Fill in the form below and Chumisa will get back to you within 12 hours to talk details and flavours.</p>

        <!-- Form action points to Formspree (replace with your endpoint later) -->
        <form action="https://formspree.io/f/your-form-id" method="POST">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="occasion">Occasion:</label>
            <input type="text" id="occasion" name="occasion" placeholder="Birthday, wedding, graduation...">

            <label for="date">Date Needed:</label>
            <input type="date" id="date" name="date" required>

            <label for="budget">Budget Bracket:</label>
            <select id="budget" name="budget">
                <option value="450-600">R450 – R600</option>
                <option value="600-900">R600 – R900</option>
                <option value="900+">R900+</option>
            </select>

            <label for="inspiration">Upload Inspiration Photo (optional):</label>
            <input type="file" id="inspiration" name="inspiration" accept="image/*">

            <label for="message">Any extra details:</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">Send Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Haya's Artisan Bakery. Mowbray, Cape Town.</p>
    </footer>
</body>
</html>
